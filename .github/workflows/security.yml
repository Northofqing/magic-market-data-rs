name: Security and release gates
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audited coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: cargo llvm-cov --version
      - run: cargo llvm-cov clean --workspace
      - name: Produce coverage evidence
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "1"
        run: cargo llvm-cov --workspace --all-features --locked --json --output-path coverage.json -- --test-threads=1
      - run: python3 tools/coverage/check_thresholds.py coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
