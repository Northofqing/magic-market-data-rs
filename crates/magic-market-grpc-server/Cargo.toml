[package]
name = "magic-market-grpc-server"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded external gRPC leaf service for magic-market"
publish = false

[dependencies]
bytes = "1"
magic-market-grpc-contracts = { path = "../magic-market-grpc-contracts", version = "=0.2.0" }
magic-market-service = { path = "../magic-market-service", version = "=0.2.0" }
prost = "=0.14.3"
thiserror.workspace = true
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net", "sync"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "tls-ring", "transport"] }
tonic-health = "=0.14.6"
tonic-reflection = "=0.14.6"

[[bin]]
name = "magic-market-grpc-server"
path = "src/main.rs"
test = true
bench = false

[lints]
workspace = true
