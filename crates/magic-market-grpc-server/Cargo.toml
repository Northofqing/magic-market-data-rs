[package]
name = "magic-market-grpc-server"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded external gRPC leaf service for magic-market"
publish = false

[dependencies]
bytes = "1"
magic-market-composition = { path = "../magic-market-composition", version = "=0.2.0" }
magic-market-core = { path = "../magic-market-core", version = "=0.2.0" }
magic-market-grpc-contracts = { path = "../magic-market-grpc-contracts", version = "=0.2.0" }
magic-market-service = { path = "../magic-market-service", version = "=0.2.0" }
prost = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "std"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net", "sync"] }
tonic = { workspace = true, features = ["codegen", "router", "tls-ring", "transport"] }
tonic-health = "=0.14.6"
tonic-reflection = "=0.14.6"

[[bin]]
name = "magic-market-grpc-server"
path = "src/main.rs"
test = true
bench = false

[lints]
workspace = true
