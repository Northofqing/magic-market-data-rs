[package]
name = "magic-tdx-rs"
version = "0.2.0"
edition.workspace = true
license.workspace = true
[dependencies]
magic-market-core = { path = "../magic-market-core", version = "=0.2.0" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
time = { version = "=0.3.54", default-features = false, features = ["formatting", "std"] }
flate2 = "1"
crc32fast = "1"
encoding_rs = "0.8"
regex = "1"
tokio = { version = "1.50", features = ["net","io-util","rt","rt-multi-thread","time","sync","macros","test-util"] }
[lints]
workspace = true
