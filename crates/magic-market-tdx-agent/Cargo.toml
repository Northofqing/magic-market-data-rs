[package]
name = "magic-market-tdx-agent"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "magic-market-tdx-agent"
path = "src/main.rs"

[dependencies]
magic-market-core = { path = "../magic-market-core", version = "=0.2.0" }
magic-market-grpc-contracts = { path = "../magic-market-grpc-contracts", version = "=0.2.0" }
serde_json = { workspace = true }
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "std"] }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.19"
tonic = { workspace = true, features = ["codegen", "tls-ring", "tls-webpki-roots", "transport"] }

[lints]
workspace = true
