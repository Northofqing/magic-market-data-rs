[package]
name = "magic-market-tdx-agent"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "magic-market-tdx-agent"
path = "src/main.rs"

[dependencies]
magic-market-grpc-contracts = { path = "../magic-market-grpc-contracts", version = "=0.2.0" }
serde_json = "1"
thiserror.workspace = true
time = { version = "=0.3.54", default-features = false, features = ["formatting", "std"] }
tokio = { version = "=1.52.3", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.19"
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "tls-ring", "tls-webpki-roots", "transport"] }

[lints]
workspace = true
